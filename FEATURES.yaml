  title: 把一条资料导出为 Markdown 文件
  status: planned
  surfaces:
    api: []
  manual: 详情页点导出，生成 .md 并打开所在目录
  notes: 还没做。需要的落点：后端 /api/items/{id}/export，前端 #exportItem

- id: wechat4-live
  title: 微信 4.x 实时订阅（每有新推文立即抓）
  status: dropped
  surfaces:
    api: []
  manual: -
  notes: 2026-11-16 放弃：4.x 只在收到推送或打开会话时落盘正文，实时订阅做不到稳定，
        改为「打开面板时按需读内存 + 每 30 分钟补同步」

- id: reading-workbench
  title: 阅读工作台（离线原文与精读/笔记/Ideas 并排）
  status: done
  since: 2026-11-26
  surfaces:
    api: ["GET /api/items/{item_id}/archive"]
    ui: ["#workbench", "#wbBody", "#wbClose"]
    test: ["test_workbench.py"]
  manual: 点资料库条目 → 离线页单栏居中；点「精读」→ 原文让到左、精读进右；关掉一栏 → 自动回居中；点暗处与按 Esc 都不关，只有 ✕ 关
  notes: 切 tab 用 visibility 藏 iframe（display:none 会重置内部滚动位置）；Esc 合成的 cancel 是 cancelable:false，必须拦 keydown；离线页不能加 X-Frame-Options

- id: reading-mode-switch
  title: 阅读排布可切换（阅读工作台 / 经典弹层）
  status: done
  since: 2026-11-26
  surfaces:
    api: ["GET /api/settings", "PUT /api/settings"]
    ui: ["#uiReadingMode", "#uiReadingHint", "#uiPanel"]
    test: ["test_workbench.py"]
  manual: 设置 → 参数设置 → 界面与阅读：选「经典弹层」后点任意条目，先看精读、离线阅读页在浏览器新标签打开；选回「阅读工作台」，点条目直接在软件里看原文
  notes: 两套界面都保留，只换渲染入口（showItemClassic / openWorkbench）；watchItem 的存活判断要按模式分别看 detailDialog.open 与 wbIsOpen；切换时把另一套收掉，否则两个 modal 同时挂在 top layer

- id: release-directory
  title: 安装包独立目录（与源码仓库、软件安装目录分开）
  status: done
  since: 2026-11-27
  surfaces:
    test: ["test_release_layout.py"]
  manual: 发版后看 `radar.py where` 报的发布包目录；`RadarSetup.exe` 在 `<盘根>\RadarReleases\v<版本>\`，不在软件目录里
  notes: 开发目录与生产目录同在 E 盘，都用 Path.parent 算到同一个 E:/RadarReleases；要改位置设 RADAR_RELEASE_DIR；PyInstaller 中间产物在 .build，构建成功即删

- id: upgrade-cleanup
  title: 升级后不留旧安装包与废弃文件
  status: done
  since: 2026-11-27
  surfaces:
    test: ["test_updater.py"]
  manual: 装完新版本后看 `data/updates/`，只应剩下当前待装的包；装完再启动一次，目录里的 RadarSetup-*.exe 应被清空
  notes: 安装器按 .payload-manifest.json 精确删除上一版独有文件，data/config/.venv 在 KEEP_ON_UPGRADE 里不碰；更新器只在拿到 latest 时清理，断网时宁可留着也不删要用的包

- id: no-console-flash
  title: 后台子进程不弹控制台窗口
  status: done
  since: 2026-11-27
  surfaces:
    test: ["test_console_audit.py"]
    ui: []
  manual: 装一次软件（向导全程不应出现任何黑框），再在资料库里点几次「精读」；任务栏不应闪出命令行窗口
  notes: 图形宿主没有控制台，起 tasklist/pip/python 必须带 CREATE_NO_WINDOW；app/winproc.py 是唯一封装，安装器有本地 _hidden()；tools/console_audit.py 静态扫描，接了 radar.py check 与单元测试；借客户端登录态改用 psutil，彻底不起子进程
