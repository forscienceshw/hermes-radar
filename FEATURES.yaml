- id: workbench-action-pager
  title: 工作台顶栏操作条，放不下就用两侧小箭头翻页
  status: done
  since: 2026-11-27
  surfaces:
    ui: ["#wbActTrack", "#wbItemActions", ".wb-act-nav"]
    test: ["test_workbench.py"]
  manual: 打开任一条目，顶栏右侧应有一个约五六个按钮的操作条；点右箭头 › 向左翻一屏（出现「屏蔽此类 / 重新精读 / 删除」），点左箭头 ‹ 翻回来；两端按钮不应被裁掉半个字
  notes: 轨道 max-width 收在 min(46vw,470px)，否则宽屏会把十来个按钮全塞进来、箭头永远 disabled；scrollWidth 只在真溢出时才翻，can-prev/can-next 类同时控制两端渐隐；dialog 打开前量到的宽度是 0，所以 showModal 后补一帧 syncWbActions + ResizeObserver 兜底

- id: archive-link-guard
  title: 离线页里的外链不劫持阅读区，也不再卡在「拒绝连接」
  status: done
  since: 2026-11-27
  surfaces:
    api: ["POST /api/system/open-url"]
    ui: ["#workbench"]
    test: ["test_reader_links.py"]
  manual: 在离线页点「原始页面」或正文里的任意链接 → 当前阅读区不跳走，链接交给系统浏览器打开；iframe 若还是被外部导航到别的地址，会自动复位回离线页
  notes: iframe 内就地导航会变成微信「拒绝连接」且没有后退键，只能叉掉整页重开；归档页捕获 click → postMessage({type:'radar:open-url'}) → 父页面走 /api/system/open-url（app 窗口）或 window.open；外部链接一律 target=_blank&rel=noopener，guardArchiveFrame 用 load 事件兜底复位；**阅读页是静态文件，模板改了只影响新归档**，老页面要跑 scripts/upgrade_reader_pages.py 重渲染（判据里必须同时检查 radar:open-url，否则会当成已升级跳过）

- id: automation-toggles
  title: 自动下载论文 / 自动精读两个开关（省磁盘、省点数）
  status: done
  since: 2026-11-27
  surfaces:
    api: ["GET /api/settings", "PUT /api/settings"]
    ui: ["#autoDownloadPapers", "#autoAnalyze"]
    test: ["test_workbench.py"]
  manual: 设置里把「自动下载开放论文」设为关闭 → 新条目归档后不再下 PDF，论文栏显示「尚未下载到原论文」；把「自动生成精读」设为关闭 → 归档后不排精读任务；手点「重新精读」仍会跑（force_analysis=True 绕过开关），但「让软件去找原文」只补正文、任何时候都不排精读
  notes: papers.auto_download 默认 false、analysis.auto 默认 true；process_item_papers(download=None) 时回退读设置，老任务 payload 不写 download 也能跑；手动精读走 /reanalyze 带 force=True 绕过开关；找原文走 /process 且 payload 带 skip_analysis=True——不带的话「补正文」会顺手花一次点数，用户读成「点了 A 触发了 B」

- id: smart-collect
  title: 智能收藏（点按钮才推荐，不自动弹窗）
  status: done
  since: 2026-11-27
  surfaces:
    api: ["GET /api/items/{item_id}/collection-suggestions", "POST /api/collections/toggle"]
    ui: ["#smartCollect", "#smartCollectList", "#smartCollectOk", "#smartCollectPick", "[data-smart-collect]"]
    test: ["test_collect_suggest.py", "test_storage_policy.py", "test_workbench.py"]
  manual: 打开任意条目 → 什么都不弹；点顶栏（或经典弹层里）的「智能收藏」→ 才弹「要不要收藏到这个收藏夹？」；取消勾选其中一个再点「收藏到选中的」，条目的收藏夹应只剩勾上的那几个；没有匹配时弹窗照样要出现，写清是「已经在这个夹子里」还是「缺分类关键词」，并留「自己挑收藏夹」按钮；点它应直接弹出挑夹子的弹层
  notes: 按钮触发，不再自动弹窗（连着看十几条时自动弹很烦，且用户常还没想好要不要收藏）；向量与 IDF 关键词在科学文本上分不开（bge 余弦普遍 0.65–0.72，rna 会命中 tRNA），所以改用精读的 category/tags/title/summary 对收藏夹名字做子串匹配：命中 ≥3 字或整名命中才算 strong，最多两个、第二个要 ≥max(3.0,首位×0.7)；通用名（实验/科研杂谈）跳过；没有 analysis 时回退用条目自己的 category/tags_json，否则未精读的条目永远「没找到」；完全没候选也要弹窗说明并给「自己挑收藏夹」出口，静默返回等于按钮坏了


- id: storage-budget
  title: 磁盘预算：原文压缩、配图上限、备份份数都可设
  status: done
  since: 2026-11-27
  surfaces:
    api: ["GET /api/storage/usage", "GET /api/health", "GET /api/backup", "POST /api/backup/run"]
    ui: ["#backupPanel", "#maxImages", "#compressRaw", "#backupKeep", "#storageUsageInfo", "#storagePath"]
    test: ["test_storage_policy.py", "test_backup.py", "test_trash_guard.py"]
  manual: 设置 → 磁盘占用与备份：能看到数据目录真实路径与各子目录体积；把「每篇最多保存几张配图」改成 0 应表示不限；关掉「原文快照压缩保存」后新归档的条目目录里应是 raw.html 而不是 raw.html.gz；左下角「数据位置」显示的必须是本机实际路径；清理完跑 `python tools/trash.py check`，本项目在回收站里的条目必须是 0
  notes: 原文快照内嵌配图 base64，单篇 3-4 MB，gzip 后约 12%，读取统一走 archive.raw_file/read_raw_bytes，压不压对前端透明；配图上限 0 = 不限（旧的 [:0] 会一张不存）；备份份数读 storage.backup_keep，写坏就退回 7 且绝不清空；左下角与分享桥示例都从 /api/health 的 data_dir 取，不许再写死开发机路径；带安全删除垫片的环境会把直删也留一份副本，目录体积降了不等于磁盘腾出来了（实测差 22.3 GB），核账只认 trash.py check


- id: reading-mode-switch
  title: 阅读排布可切换（阅读工作台 / 经典弹层）
  status: done
  since: 2026-11-26
  surfaces:
    api: ["GET /api/settings", "PUT /api/settings"]
    ui: ["#uiReadingMode", "#uiReadingHint", "#uiPanel"]
    test: ["test_workbench.py"]
  manual: 设置 → 参数设置 → 界面与阅读：选「经典弹层」后点任意条目，先在弹层里看原文（顶部「原文/精读/论文」切换）；选回「阅读工作台」，点条目同样是原文优先
