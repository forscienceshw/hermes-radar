- id: reading-workbench
  title: 阅读工作台（离线原文与精读/笔记/Ideas/论文并排）
  status: done
  since: 2026-11-26
  surfaces:
    api: ["GET /api/items/{item_id}/archive"]
    ui: ["#workbench", "#wbBody", "#wbClose", "#wbSideSwitch", "#wbItemActions", "#wbActTrack", "#wbActReel", "#wbActPinned", "#wbJob"]
    test: ["test_workbench.py"]
  manual: 点资料库条目 → 离线页单栏居中；点「精读」→ 原文让到左、精读进右；点「论文」→ 右栏换成 PDF；点「原文」→ 收起并排回到只看原文；关掉一栏 → 自动回居中；点暗处与按 Esc 都不关，只有 ✕ 关；顶栏「问 AI / 删除」常驻在轨道外永远可点；第一页固定「打开原文 / 检查原文 / 收藏到… / 智能收藏」，第二页放「原始短链 / 重新精读 / 重新检查配图 / 屏蔽此类」，点箭头整页换一组且两页不重复；拉窗口宽度时条子跟着变长变短，任一个按钮的框都不许被切；任务跑着的时候按钮行与正文都不许自己抖；没有离线页时点「让软件去找原文」只抓正文与配图，不排精读
  notes: 切 tab 用 visibility 藏 iframe（display:none 会重置内部滚动位置）；Esc 合成的 cancel 是 cancelable:false，必须拦 keydown；离线页不能加 X-Frame-Options；四种右栏（精读/论文/笔记/Ideas）抢同一块位置，「原文」按钮是收起并排的出口；顶栏操作条两页的切点是固定的 4（wb.actSplit=first.length），不许再按宽度漂移——切点一变，用户刚记住第几页有什么就乱了；每页是轨道满宽的独立容器，翻页靠平移 reel 而不是 scroll，平移不参与布局，不会被重排打断，也不会露出隔壁页的半个按钮；宽度只由 wbPlanPages 按实测按钮宽度与可用空间算，窗口变了只改长度不改分组；当前页存 wb.actPage，重渲染后还原；轮询每 3 秒回一次，按钮行与正文都按签名（wb.actSig / wbItemSig）判断，内容没变一律不重建——重建会把光标下的按钮换人、把正在读的那一栏滚回顶部、把 PDF 的 iframe 重新加载；toast 要挂进最上层 modal 子树，body 里的浮层会被工作台遮罩压住

- id: action-feedback
  title: 点按钮有可见反馈（提示条 + 顶栏任务状态）
  status: done
  since: 2026-11-27
  surfaces:
    ui: ["#toast", "#wbJob"]
    test: ["test_workbench.py"]
  manual: 工作台里点「检查原文」→ 右下角立刻出现深色提示条，且压在工作台之上；点「重新精读」→ 标题下方出现「正在精读 · 已读 N 字 · N 秒」，完成后换成结束提示；没有任务时这条状态不占位
  notes: toast 要挂进最上层 modal 的子树并同时保留 popover（旧 WebView2 没有 Popover API 时 `[popover]` 恒为 display:none，必须摘掉属性退回 .show 类，否则一片安静）；watchItem 头两次看不到 active_job 属正常（任务还没进库），别急着停表；失败信息留在原位，不要只闪一下就消失


